<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangWorld - авторизация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="..\styles\for_main_style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="d-flex flex-column min-vh-100">
    <!--- шапка-хэдэр  -->
    <nav class="navbar navbar-expand-lg navbar-light shadow-sm fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3 me-auto" href="main.html">
                LANGWORLD
                <i class="bi bi-globe-americas"></i>
            </a>


            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav fw-semibold ms-auto">
                    <li class="nav-item me-3">
                        <a class="nav-link" href="#">Курсы</a>
                    </li>
                    <li class="nav-item me-3">
                        <a class="nav-link" href="#">О нас</a>
                    </li>
                    <li class="nav-item me-3">
                        <a class="nav-link" href="#footer">Контакты</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1">
        <div class="container h-100">
            <div class="row h-100 align-items-center justify-content-center">
                <div class="col-md-6 col-lg-4">
                    <form class="p-4">
                        <h1 class="h3 mb-3 fw-normal text-center">Авторизация</h1>
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" id="floatingInput" placeholder="aaa@a.com">
                            <label for="floatingInput">Электронная почта</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="password" class="form-control" id="floatingPassword" placeholder="Пароль">
                            <label for="floatingPassword">Пароль</label>
                        </div>
                        <div class="form-check text-start my-3">
                            <input class="form-check-input" type="checkbox" value="remember-me" id="checkDefault">
                            <label class="form-check-label" for="checkDefault">Запомнить меня</label>
                        </div>
                        <a href="profile.html" class="btn btn-primary w-100 py-2 text-decoration-none">
                            Вход
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <!--- подвал -->
    <footer class="bg-black text-white py-4 text-center" id="footer">
        <p>Разработчик: <a href="https://github.com/tpAnswer4yourself">tpAnswer4yourself</a></p>
        <p>Moscow - 2025</p>
    </footer>
</body>

</html>
